name: Build HideAllApps

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check cache
        run: |
          echo upstream_heads=$(git ls-remote https://github.com/roothide/theos | head -n 1 | cut -f 1)-$(git ls-remote https://github.com/theos/sdks | head -n 1 | cut -f 1) >> $GITHUB_ENV

      - name: Use cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          key: ${{ runner.os }}-${{ env.upstream_heads }}

      - name: Prepare Theos (roothide fork)
        uses: Randomblock1/theos-action@v1
        with:
          theos-src: 'https://github.com/roothide/theos'
          theos-sdks: 'https://github.com/theos/sdks'

      - name: Auto bump version
        run: |
          cd HideAllApps
          # 读取当前版本号
          CUR_VER=$(grep -m1 '^Version:' control | awk '{print $2}')
          echo "当前版本: $CUR_VER"
          # 拆分 x.y.z
          MAJOR=$(echo $CUR_VER | cut -d. -f1)
          MINOR=$(echo $CUR_VER | cut -d. -f2)
          PATCH=$(echo $CUR_VER | cut -d. -f3)
          if [ -z "$PATCH" ]; then PATCH=0; fi
          # 补丁号 +1
          NEW_PATCH=$((PATCH + 1))
          NEW_VER="${MAJOR}.${MINOR}.${NEW_PATCH}"
          echo "新版本: $NEW_VER"
          # 更新 control
          sed -i '' "s/^Version: .*/Version: $NEW_VER/" control
          cat control
          echo "NEW_VER=$NEW_VER" >> $GITHUB_ENV

      - name: Build package
        run: |
          cd HideAllApps
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1 -j$(sysctl -n hw.ncpu)

      - name: Find deb
        run: |
          echo "构建完成，检查文件："
          find ${{ github.workspace }} -name "*.deb" -type f

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: HideAllApps-deb-v${{ env.NEW_VER }}
          path: ${{ github.workspace }}/HideAllApps/packages/*.deb
